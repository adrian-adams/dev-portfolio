name: CI

on:
    push:
        branches: [main]
    pull_request: 
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: div-portfolio

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Node
                uses: actions/setup-node@v4
                with: 
                    cache: 'npm'
                    cache-dependency-path: dev-portfolio/package-lock.json

            -   name: Install dependencies
                run: npm ci 

            -   name: Lint
                run: npm run Lint

            -   name: Type check
                run: npx tsc --noEmit

            -   name: Build
                run: npm run build